{{- if .Values.cloudflare.existingSecret }}
{{- if or .Values.shoutrrr .Values.healthchecks .Values.uptimeKuma }}
{{- fail "shoutrrr, healthchecks and uptimeKuma are read from the Secret: when cloudflare.existingSecret is set, add SHOUTRRR / HEALTHCHECKS / UPTIMEKUMA keys to that Secret instead" }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflare-ddns.fullname" . }}
  labels:
    {{- include "cloudflare-ddns.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUDFLARE_API_TOKEN: {{ required "cloudflare.apiToken is required when cloudflare.existingSecret is not set" .Values.cloudflare.apiToken | quote }}
  {{- if .Values.shoutrrr }}
  SHOUTRRR: {{ .Values.shoutrrr | quote }}
  {{- end }}
  {{- if .Values.healthchecks }}
  HEALTHCHECKS: {{ .Values.healthchecks | quote }}
  {{- end }}
  {{- if .Values.uptimeKuma }}
  UPTIMEKUMA: {{ .Values.uptimeKuma | quote }}
  {{- end }}
{{- end }}
